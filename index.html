<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#090a09"><title>Spotial · Olivia’s Pizza Walk</title><link rel="stylesheet" href="./style.css"></head><body><main id="device">
<section id="entry"><img class="phone-image" src="assets/maps.png" alt="Map showing Nonna’s Slice on Crown Street"><button id="spot" aria-label="Pull Spot inward to enter"><img src="assets/spot.svg" alt=""></button><span class="coach">Pull to Spotialize</span></section>
<section id="splash" hidden><div class="splash-gallery"></div><div class="from">From <b>Maps</b></div><p>Spotializing</p></section>
<section id="layer" hidden><div class="glow"></div><header><button id="home" aria-label="Back to Maps"><b>spotial</b> suggest</button><button id="mode" aria-label="Switch context display" aria-pressed="false">▰　☷</button></header><div id="context"></div>
<div id="scroller" tabindex="0" role="region" aria-label="Spotlight feed"><div id="rail"><div id="stage"></div></div></div>
</section>
<section id="full" hidden></section><section id="source" hidden></section><section id="app" hidden><img class="phone-image" alt=""><button class="back">‹ Spotial</button></section>
<form id="input" hidden><input aria-label="Ask Spotial" placeholder="Ask Spotial anything..." maxlength="220"><button aria-label="Submit question">↗</button></form><div id="notice" role="status"></div></main><script type="module" src="./main.js"></script></body></html>
